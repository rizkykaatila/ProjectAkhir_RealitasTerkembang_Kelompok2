<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Stadion Gajayana - Virtual Tour</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: "Segoe UI", system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background-image: url('Assets/home.jpg');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
      position: relative;
    }

    /* Dark overlay for better text readability */
    body::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.5);
      z-index: 1;
    }

    .container {
      position: relative;
      z-index: 2;
      text-align: center;
      padding: 2rem;
      max-width: 600px;
      background: rgba(255, 255, 255, 0.95);
      border-radius: 20px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      backdrop-filter: blur(10px);
    }

    h1 {
      font-size: 2.5rem;
      color: #1a1a1a;
      margin-bottom: 0.5rem;
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    .subtitle {
      font-size: 1.1rem;
      color: #666;
      margin-bottom: 2.5rem;
      font-weight: 400;
    }

    .button-container {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .nav-button {
      padding: 1.2rem 2rem;
      font-size: 1.1rem;
      font-weight: 600;
      color: #fff;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      border: none;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
      text-decoration: none;
      display: block;
    }

    .nav-button:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(102, 126, 234, 0.6);
    }

    .nav-button:active {
      transform: translateY(0);
    }

    .nav-button.secondary {
      background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
      box-shadow: 0 4px 15px rgba(245, 87, 108, 0.4);
    }

    .nav-button.secondary:hover {
      box-shadow: 0 6px 20px rgba(245, 87, 108, 0.6);
    }

    .icon {
      margin-right: 0.5rem;
      font-size: 1.3rem;
    }

    @media (max-width: 768px) {
      h1 {
        font-size: 2rem;
      }

      .subtitle {
        font-size: 1rem;
      }

      .nav-button {
        padding: 1rem 1.5rem;
        font-size: 1rem;
      }

      .container {
        margin: 1rem;
      }
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>Stadion Gajayana</h1>
    <p class="subtitle">Pilih pintu masuk untuk memulai tur virtual</p>

    <div class="button-container">
      <a href="depan_loket.html" class="nav-button">
        Masuk Lewat Pintu Utama
      </a>

      <a href="loket_alt.html" class="nav-button secondary">
        Masuk Lewat Pintu Alternatif
      </a>
    </div>
  </div>
</body>

</html>
