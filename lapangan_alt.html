<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>South Entry VR</title>

  <!-- A-Frame core + look-at component -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/aframe-look-at-component@1.0.0/dist/aframe-look-at-component.min.js"></script>

  <style>
    body {
      margin: 0;
      font-family: "Segoe UI", system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: #000;
    }

    /* 2D HUD instructions at top center */
    .hud {
      position: absolute;
      top: 1.5rem;
      left: 50%;
      transform: translateX(-50%);
      padding: 0.75rem 1.25rem;
      border-radius: 999px;
      background: rgba(0, 0, 0, 0.55);
      color: #fff;
      font-size: 0.95rem;
      letter-spacing: 0.03em;
      z-index: 10;
      backdrop-filter: blur(6px);
    }
  </style>
</head>

<body>
  <!-- HUD text: edit here for different on-screen tips -->
  <div class="hud">
    Lapangan Tenis • Center circle = gaze cursor • Hold on waypoint 3s to travel
  </div>

  <a-scene
    background="color: #000"
    vr-mode-ui="enabled: true"
    renderer="antialias: true; colorManagement: true">

    <!-- Assets -->
    <a-assets>
      <!-- 360 sky texture -->
      <img id="southEntry360" src="Assets/lapangan_alt.jpg" crossorigin="anonymous" alt="Atas Gedung 360" />

      <!-- Marker models -->
      <a-asset-item id="navPinModel" src="Assets/location_pin.glb"></a-asset-item>
      <a-asset-item id="infoPinModel" src="Assets/info.glb"></a-asset-item>

      <!-- HUD info stub image (replace with any image you like) -->
      <img id="infoStubImage" src="Assets/info_lapangan_alt.jpg" crossorigin="anonymous" alt="Info Stub Placeholder" />
    </a-assets>

    <!-- 360 Sky -->
    <a-sky src="#southEntry360" rotation="0 -90 0"></a-sky>

    <!-- Camera rig -->
    <a-entity id="rig" position="0 1.6 0">
      <a-camera
        id="playerCamera"
        wasd-controls-enabled="false"
        look-controls="pointerLockEnabled: true"
        raycaster="objects: .nav-hotspot, .info-hotspot; far: 30">

        <!-- Gaze cursor -->
        <a-entity id="gazeCursor"
                  cursor="fuse: true; fuseTimeout: 3000"
                  position="0 0 -1"
                  geometry="primitive: ring; radiusInner: 0.01; radiusOuter: 0.018"
                  material="color: #ffffff; shader: flat; opacity: 0.95; transparent: true"
                  animation__pulse="property: scale; dir: alternate; dur: 1200;
                                    easing: easeInOutSine; loop: true; to: 0.9 0.9 0.9">
        </a-entity>

        <!-- Info HUD, attached to camera so it always follows view (Modern Style) -->
        <a-entity id="infoHud" position="-1.1 0 -1.2" rotation="0 0 0">
          <!-- Background panel - white with high opacity (like Home.html container) -->
          <a-plane id="infoHudBg"
                   width="1.3" height="1.6"
                   material="color: #ffffff; opacity: 0; shader: flat; transparent: true; depthTest: false; depthWrite: false"
                   animation__fadein="property: material.opacity; from: 0; to: 0.95;
                                      dur: 220; easing: easeOutQuad; startEvents: showHud"
                   animation__fadeout="property: material.opacity; from: 0.95; to: 0;
                                       dur: 200; easing: easeInQuad; startEvents: hideHud">
          </a-plane>

          <!-- Title - dark color like Home.html h1 -->
          <a-text id="infoHudTitle"
                  value="Info Title"
                  position="0 0.65 0.01"
                  color="#1a1a1a"
                  width="1.1"
                  wrap-count="24"
                  align="center"
                  font="roboto"
                  opacity="0"
                  animation__fadein="property: opacity; from: 0; to: 1;
                                     dur: 220; easing: easeOutQuad; startEvents: showHud"
                  animation__fadeout="property: opacity; from: 1; to: 0;
                                      dur: 200; easing: easeInQuad; startEvents: hideHud">
          </a-text>

          <!-- Image -->
          <a-image id="infoHudImage"
                   position="0 0.15 0.01"
                   width="1.1" height="0.65"
                   src="#infoStubImage"
                   material="opacity: 0; transparent: true; depthTest: false; depthWrite: false"
                   animation__fadein="property: material.opacity; from: 0; to: 1;
                                      dur: 220; easing: easeOutQuad; startEvents: showHud"
                   animation__fadeout="property: material.opacity; from: 1; to: 0;
                                       dur: 200; easing: easeInQuad; startEvents: hideHud">
          </a-image>

          <!-- Body - gray color like Home.html subtitle -->
          <a-text id="infoHudBody"
                  value="Info description"
                  position="0 -0.42 0.01"
                  color="#666666"
                  width="1.15"
                  wrap-count="32"
                  align="center"
                  font="roboto"
                  opacity="0"
                  animation__fadein="property: opacity; from: 0; to: 1;
                                     dur: 220; easing: easeOutQuad; startEvents: showHud"
                  animation__fadeout="property: opacity; from: 1; to: 0;
                                      dur: 200; easing: easeInQuad; startEvents: hideHud">
          </a-text>
        </a-entity>
      </a-camera>
    </a-entity>

    <!-- Navigation hotspot -->
    <a-entity class="nav-hotspot nav-loket_alt"
              data-target="loket_alt.html"
              position="10 2 10"
              rotation="0 120 0">
      <a-entity gltf-model="#navPinModel" scale="0.5 0.5 0.5"></a-entity>

      <!-- Label -->
      <a-entity position="0 0.9 0.05"
                text="value: Ke Dalam Gedung; align: center; color: #fff; width: 3; wrapCount: 18"
                look-at="#playerCamera">
      </a-entity>
    </a-entity>

    <!-- Info hotspot -->
    <a-entity class="info-hotspot info-stub"
              data-info-title="Pertandingan Tenis di Gajayana"
              data-info-body="Di lapangan tenis Gajayana, para atlet saling berhadapan dalam pertandingan yang penuh fokus dan strategi. Pantulan bola di atas permukaan lapangan dan sorak kecil penonton menambah hidup suasana kompetisi."
              data-info-image="#infoStubImage"
              position="0 0.4 -25"
              rotation="0 0 0">

      <!-- Invisible collider to make it easy to hit with gaze -->
      <a-entity geometry="primitive: sphere; radius: 0.85"
                material="color: #fff; opacity: 0; transparent: true; shader: flat;
                          depthTest: false; depthWrite: false"
                visible="true">
      </a-entity>

      <!-- Visible info pin -->
      <a-entity gltf-model="#infoPinModel" scale="0.4 0.4 0.4"></a-entity>

      <!-- Label -->
      <a-entity position="0 0.9 0.05"
                text="value: Info Stub; align: center; color: #fff; width: 2.5; wrapCount: 18"
                look-at="#playerCamera">
      </a-entity>
    </a-entity>
  </a-scene>

  <!-- Behaviour logic -->
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      var scene = document.querySelector('a-scene');
      
      // Wait for scene to be loaded before accessing entities
      if (scene.hasLoaded) {
        init();
      } else {
        scene.addEventListener('loaded', init);
      }

      function init() {
        var navHotspots = document.querySelectorAll('.nav-hotspot');
        var infoHotspots = document.querySelectorAll('.info-hotspot');

        var gazeCursor = document.getElementById('gazeCursor');
        var infoHudBg = document.getElementById('infoHudBg');
        var infoHudImage = document.getElementById('infoHudImage');
        var infoHudTitle = document.getElementById('infoHudTitle');
        var infoHudBody = document.getElementById('infoHudBody');

        var defaultCursorColor = '#ffffff';
        var activeCursorColor = '#1e88ff';
        var pulseAnimation = null;

        if (gazeCursor) {
          pulseAnimation = gazeCursor.getAttribute('animation__pulse');
        }

        function setCursorColor(color) {
          if (!gazeCursor) return;
          gazeCursor.setAttribute('material', 'color', color);
        }

        function shrinkCursor() {
          if (!gazeCursor) return;
          if (pulseAnimation) {
            gazeCursor.removeAttribute('animation__pulse');
          }
          // Remove and re-add animation to force replay
          gazeCursor.removeAttribute('animation__shrink');
          setTimeout(function() {
            gazeCursor.setAttribute('animation__shrink', {
              property: 'scale',
              to: '0.6 0.6 0.6',
              dur: 150,
              easing: 'easeOutQuad'
            });
          }, 10);
        }

        function resetCursorScale() {
          if (!gazeCursor) return;
          // Remove and re-add animation to force replay
          gazeCursor.removeAttribute('animation__grow');
          setTimeout(function() {
            gazeCursor.setAttribute('animation__grow', {
              property: 'scale',
              to: '1 1 1',
              dur: 150,
              easing: 'easeOutQuad'
            });
          }, 10);
          if (pulseAnimation) {
            setTimeout(function() {
              gazeCursor.setAttribute('animation__pulse', pulseAnimation);
            }, 160);
          }
        }

        // Navigation hotspots
        navHotspots.forEach(function (hotspot) {
          hotspot.addEventListener('mouseenter', function () {
            shrinkCursor();
            setCursorColor(activeCursorColor);
          });

          hotspot.addEventListener('mouseleave', function () {
            resetCursorScale();
            setCursorColor(defaultCursorColor);
          });

          hotspot.addEventListener('click', function () {
            var target = hotspot.getAttribute('data-target');
            if (target) {
              window.location.href = target;
            }
          });
        });

        // Info hotspots
        infoHotspots.forEach(function (hotspot) {
          hotspot.addEventListener('mouseenter', function () {
            var image = hotspot.getAttribute('data-info-image') || '#infoStubImage';
            var title = hotspot.getAttribute('data-info-title') || 'Info Title';
            var body = hotspot.getAttribute('data-info-body') || 'Describe this point of interest here.';

            if (infoHudImage) infoHudImage.setAttribute('src', image);
            if (infoHudTitle) infoHudTitle.setAttribute('value', title);
            if (infoHudBody) infoHudBody.setAttribute('value', body);

            // Enable depth testing when showing HUD (so it blocks markers)
            if (infoHudBg) {
              infoHudBg.setAttribute('material', 'depthTest', true);
              infoHudBg.setAttribute('material', 'depthWrite', true);
              infoHudBg.emit('showHud');
            }
            if (infoHudImage) {
              infoHudImage.setAttribute('material', 'depthTest', true);
              infoHudImage.setAttribute('material', 'depthWrite', true);
              infoHudImage.emit('showHud');
            }
            if (infoHudTitle) infoHudTitle.emit('showHud');
            if (infoHudBody) infoHudBody.emit('showHud');

            setCursorColor(activeCursorColor);
          });

          hotspot.addEventListener('mouseleave', function () {
            if (infoHudBg) infoHudBg.emit('hideHud');
            if (infoHudImage) infoHudImage.emit('hideHud');
            if (infoHudTitle) infoHudTitle.emit('hideHud');
            if (infoHudBody) infoHudBody.emit('hideHud');

            // Disable depth testing after hiding HUD (so it doesn't block markers when invisible)
            setTimeout(function() {
              if (infoHudBg) {
                infoHudBg.setAttribute('material', 'depthTest', false);
                infoHudBg.setAttribute('material', 'depthWrite', false);
              }
              if (infoHudImage) {
                infoHudImage.setAttribute('material', 'depthTest', false);
                infoHudImage.setAttribute('material', 'depthWrite', false);
              }
            }, 220); // Wait for fade out animation to complete

            setCursorColor(defaultCursorColor);
          });
        });
      }
    });
  </script>
</body>

</html>
